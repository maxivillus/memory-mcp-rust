[package]
name = "memory-mcp-rust"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A compatibility-first Rust implementation of the memory-mcp stdio server"

[dependencies]
hex = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

